{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steganography Project</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        h1 {
            margin-bottom: 2rem;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .stego-image {
            max-width: 500px;
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .stego-image:hover {
            transform: scale(1.02);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #1e1e1e;
            padding: 2rem;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid #333;
        }

        .modal-header {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #00ffcc;
        }

        .modal-body {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .close-btn {
            background-color: #00ffcc;
            color: #121212;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .close-btn:hover {
            background-color: #00cca3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Steganography Explorer</h1>
        <img src="{% static 'stego/encoded_image.png' %}" alt="Steganography Image" class="stego-image" id="encodedImage">
        <p style="margin-top: 1rem; color: #888;">Click the image to reveal its secret</p>
    </div>

    <div id="messageModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Hidden Message Found!</div>
            <div class="modal-body" id="modalMessage">
                Decoding...
            </div>
            <button class="close-btn" id="closeModal">Close</button>
        </div>
    </div>

    <script>
        const image = document.getElementById('encodedImage');
        const modal = document.getElementById('messageModal');
        const modalMessage = document.getElementById('modalMessage');
        const closeBtn = document.getElementById('closeModal');

        image.onclick = async function() {
            modal.style.display = "flex";
            modalMessage.innerText = "Decoding...";
            
            try {
                const response = await fetch('/decode/');
                const data = await response.json();
                
                if (data.status === 'success') {
                    modalMessage.innerText = data.message;
                } else {
                    modalMessage.innerText = "Error: " + (data.message || "Unknown error");
                }
            } catch (error) {
                modalMessage.innerText = "Request failed: " + error.message;
            }
        }

        closeBtn.onclick = function() {
            modal.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
